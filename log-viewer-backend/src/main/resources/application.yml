server:
  address: 127.0.0.1        # [A4] local-only; never exposed on the network
  port: 8080

spring:
  application:
    name: log-viewer-backend
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

logviewer:
  kube:
    # [A2] C:\Users\{user}\.kube on Windows. Override with
    #      --logviewer.kube.directory=... or env LOGVIEWER_KUBE_DIRECTORY
    directory: ${user.home}/.kube
    # [A3] file used at startup until the UI selects another one
    default-file: config
    # [A3] which files in the directory are offered as kubeconfigs
    file-pattern: "^config([-.].*)?$"
    request-timeout-ms: 30000
  logs:
    default-tail-lines: 500
    max-tail-lines: 50000
  cors:
    allowed-origins:
      - http://localhost:4200   # [A7] Angular dev server
      - http://127.0.0.1:4200

logging:
  level:
    com.example.logviewer: DEBUG
    io.fabric8: INFO
