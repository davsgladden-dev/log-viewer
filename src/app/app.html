<header class="topbar">
  <h1>Log Viewer</h1>
  @if (store.sourceName()) {
  <span class="source">{{ store.sourceName() }}</span>
  }
  @if (store.entries().length) {
  <span class="spacer"></span>
  <span class="count">{{ store.visible().length }} / {{ store.entries().length }} lines</span>
  <button (click)="store.clear()">Clear</button>
  <app-kube-log-refresh />
  }
</header>

<main>
  @if (store.entries().length) {
  <app-toolbar />
  <app-log-list />
  @if (store.selected()) {
  <app-log-detail />
  }
  } @else {
  <div class="source-toggle">
    <button type="button" [class.active]="source() === 'paste'" (click)="source.set('paste')">Paste / File</button>
    <button type="button" [class.active]="source() === 'kube'"  (click)="source.set('kube')">Kubernetes</button>
  </div>
  @if (source() === 'paste') {
  <app-log-input />
  } @else {
  <app-kube-panel />
  }
  }
</main>
